esphome:
  name: bunker-heizung
  friendly_name: Bunker Heizung

  includes:
    - cc1101.h

  libraries:
    - SPI
    - "SmartRC-CC1101-Driver-Lib"

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: VERBOSE

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Bunker-Heizung-Fallback"
    password: "BunkerHeizung123"

captive_portal:

web_server:
  port: 80

remote_transmitter:
  - id: transmitter
    pin:
      number: GPIO4
      allow_other_uses: true
    carrier_duty_percent: 100%

remote_receiver:
  - id: receiver
    pin:
      number: GPIO4
      allow_other_uses: true
    dump:
      - raw